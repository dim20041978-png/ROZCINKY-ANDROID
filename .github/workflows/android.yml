name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Import licensed offline catalog photos
        run: |
          python -m pip install Pillow
          python scripts/import_photos.py
      - run: gradle assembleDebug lintDebug
      - name: Verify bundled photos in APK
        run: |
          python -c 'import glob,zipfile; p=glob.glob("app/build/outputs/apk/debug/*.apk")[0]; z=zipfile.ZipFile(p); assert len([n for n in z.namelist() if n.startswith("assets/graphics/jobs_") and n.endswith(".jpg")]) == 14; assert "assets/graphics/photo_credits.json" in z.namelist()'
      - uses: actions/upload-artifact@v4
        with:
          name: ROZCINKY-1.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
